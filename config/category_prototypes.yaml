# Evaluation-only semantic prototypes. Category suggestions remain disabled
# until representative, reviewed line-item labels clear the accuracy gate.
ICU: Intensive care unit, ICU bed and critical care charges.
ROOM: Hospital room rent, room and accommodation charges.
DOCTOR_NURSING: Doctor, physician, consultant, nursing and consultation fees.
SURGERY_OT: Surgery, operation, procedure and operating theatre charges.
PHARMACY: Pharmacy, medicines, drugs and medication charges.
INVESTIGATION: Laboratory tests, pathology, diagnostic investigations, imaging, radiology, ECG, CT, MRI and ultrasound.
ADMISSION: Hospital admission and registration charges.
CONSUMABLE: Medical consumables such as gloves, syringes, catheters and dressings.
OTHER: Miscellaneous hospital charges that do not match a specific medical service category.
