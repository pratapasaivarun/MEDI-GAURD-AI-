<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">MediGuard AI prototype architecture</title>
<desc id="desc">Fictional medical bill, policy and settlement letter enter the application. Extraction and policy indexing feed deterministic claim rules. Settlement parsing feeds comparison. Explanations and reports use the comparison, and a reviewer confirms the result. SQLite and private local files store the prototype data.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#91a6b7"/></marker>
  <style>
   .bg{fill:#101820}.box{rx:14;stroke-width:2}.input{fill:#17212b;stroke:#607080}.extract{fill:#673d0b;stroke:#d99728}.policy{fill:#075448;stroke:#24a987}.rules{fill:#673d0b;stroke:#d99728}.compare{fill:#3d348b;stroke:#8c81ed}.assist{fill:#075448;stroke:#24a987}.report{fill:#673d0b;stroke:#d99728}.app{fill:#47320c;stroke:#efb23c}.store{fill:#17212b;stroke:#607080}.t{font:600 20px Segoe UI,Arial;fill:#f4f7fb}.s{font:15px Segoe UI,Arial;fill:#c5d1de}.gold{fill:#ffc866}.green{fill:#7de0c4}.purple{fill:#c4bdff}.line{stroke:#91a6b7;stroke-width:3;fill:none;marker-end:url(#arrow)}.plain{stroke:#91a6b7;stroke-width:3;fill:none}
  </style>
</defs>
<rect class="bg" width="1200" height="780"/>
<text x="600" y="40" text-anchor="middle" class="t" font-size="27">MediGuard AI · fictional-data prototype</text>
<!-- inputs -->
<rect class="box input" x="55" y="75" width="300" height="68"/><text x="205" y="105" text-anchor="middle" class="t">Hospital bill</text><text x="205" y="128" text-anchor="middle" class="s">PDF text or scanned pages</text>
<rect class="box input" x="450" y="75" width="300" height="68"/><text x="600" y="105" text-anchor="middle" class="t">Insurance policy PDF</text><text x="600" y="128" text-anchor="middle" class="s">Terms and source clauses</text>
<rect class="box input" x="845" y="75" width="300" height="68"/><text x="995" y="105" text-anchor="middle" class="t">Settlement letter</text><text x="995" y="128" text-anchor="middle" class="s">Payment and deductions</text>
<!-- extraction -->
<path class="line" d="M205 143 V175"/><path class="line" d="M600 143 V175"/>
<rect class="box extract" x="55" y="180" width="695" height="80"/><text x="402" y="213" text-anchor="middle" class="t gold">extraction.py</text><text x="402" y="238" text-anchor="middle" class="s">Fields · line items · totals · dates · OCR; uncertain fields flagged for review</text>
<rect class="box compare" x="845" y="180" width="300" height="80"/><text x="995" y="213" text-anchor="middle" class="t purple">Settlement parser</text><text x="995" y="238" text-anchor="middle" class="s">settlement.py: paid amount + deductions</text>
<!-- terms / index -->
<path class="line" d="M402 260 V295"/><path class="line" d="M600 260 V295"/>
<rect class="box policy" x="55" y="300" width="695" height="80"/><text x="402" y="333" text-anchor="middle" class="t green">policy_terms.py + policy_index.py</text><text x="402" y="358" text-anchor="middle" class="s">Candidate limits + searchable clause evidence and page numbers</text>
<!-- deterministic rules -->
<path class="line" d="M402 380 V420"/>
<rect class="box rules" x="55" y="425" width="695" height="80"/><text x="402" y="458" text-anchor="middle" class="t gold">rules.py · deterministic Decimal calculations</text><text x="402" y="483" text-anchor="middle" class="s">Caps · exclusions · sub-limits · sum insured · deductible · co-pay</text>
<!-- comparison -->
<path class="line" d="M402 505 V548"/><path class="line" d="M995 260 V548"/>
<rect class="box compare" x="180" y="553" width="840" height="80"/><text x="600" y="586" text-anchor="middle" class="t purple">comparison.py · policy estimate vs insurer settlement</text><text x="600" y="611" text-anchor="middle" class="s">no discrepancy · possible discrepancy · manual review</text>
<!-- llm / reports and app -->
<path class="line" d="M420 633 V670 H280 V690"/><path class="line" d="M780 633 V670 H920 V690"/>
<rect class="box assist" x="70" y="695" width="420" height="64"/><text x="280" y="723" text-anchor="middle" class="t green">agents.py · optional explanation only</text><text x="280" y="746" text-anchor="middle" class="s">Ollama or template fallback; cannot change rules amounts</text>
<rect class="box report" x="710" y="695" width="420" height="64"/><text x="920" y="723" text-anchor="middle" class="t gold">reports.py · appeal and review drafts</text><text x="920" y="746" text-anchor="middle" class="s">Generated only when comparison evidence supports a draft</text>
<!-- note -->
<text x="600" y="675" text-anchor="middle" class="s">ui/ + app.py: upload validation · reviewer confirmation · result display · SQLite/local files</text>
</svg>
